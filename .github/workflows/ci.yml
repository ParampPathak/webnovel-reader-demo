name: Demo quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install chromium webkit
      - name: Start isolated static preview
        shell: pwsh
        run: Start-Process -FilePath node -ArgumentList 'scripts/serve.mjs' -WindowStyle Hidden
      - run: npm run test:browser
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
