name: Demo quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install chromium webkit
      - name: Windows browser and accessibility regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          $preview = Start-Process -FilePath node -ArgumentList 'scripts/serve.mjs' -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -RedirectStandardOutput test-results/server.stdout.log -RedirectStandardError test-results/server.stderr.log -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $response = Invoke-WebRequest http://127.0.0.1:4330 -TimeoutSec 2; if ($response.StatusCode -eq 200) { $ready = $true; break } } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Static preview did not become healthy' }
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw 'Browser regressions failed' }
            npm run test:accessibility
            if ($LASTEXITCODE -ne 0) { throw 'Accessibility checks failed' }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-results
          path: test-results/
