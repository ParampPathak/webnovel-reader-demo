name: Public release verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  public-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            browser: chromium
          - os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DEMO_URL: https://reader.parampathak.com
      BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install ${{ matrix.browser }}
      - run: node scripts/verify-deployment.mjs
      - run: npm run test:browser
      - run: npm run test:cache
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-verification-${{ matrix.browser }}
          path: test-results/
